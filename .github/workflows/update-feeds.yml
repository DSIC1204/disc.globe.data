{
"name": "Update DSIC feeds",
"on": { "schedule": [ { "cron": "*/5 * * * *" } ], "workflow_dispatch": {} },
"permissions": { "contents": "write" },
"concurrency": { "group": "dsic-feeds", "cancel-in-progress": false },
"jobs": { "update": {
"runs-on": "ubuntu-24.04",
"timeout-minutes": 15,
"steps": [
{ "uses": "actions/checkout@v5" },
{ "name": "Update feeds", "run": "python3 dsic_update.py --ci", "env": { "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}" } }
]
} }
}
